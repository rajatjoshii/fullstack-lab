name: Build and Push to ECR

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::017820664528:role/GitHubOIDC-ECR-Access
        aws-region: us-east-1

    - name: Log in to Amazon ECR
      run: |
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 017820664528.dkr.ecr.us-east-1.amazonaws.com

    - name: Build and Push Backend Image
      run: |
        cd mybackend
        docker buildx build --platform linux/amd64 -t 017820664528.dkr.ecr.us-east-1.amazonaws.com/backend:latest --push .

    - name: Build and Push Frontend Image
      run: |
        cd frontend
        docker buildx build --platform linux/amd64 -t 017820664528.dkr.ecr.us-east-1.amazonaws.com/frontend-prod:latest --push .
